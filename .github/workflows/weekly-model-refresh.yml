name: Weekly Data & Model Refresh

on:
  schedule:
    # Every Monday at 04:00 UTC (after weekend football fixtures finish)
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-historical-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migrations
        run: pnpm check-migrations

      - name: Trigger Supabase current-season sync (when APP_URL & CRON_SECRET are configured)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping Supabase sync: add APP_URL and CRON_SECRET repository secrets to enable."
            exit 0
          fi
          URL="${APP_URL%/}/api/cron/sync-season"
          echo "Triggering $URL ..."
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/sync-response.json \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL")
          cat /tmp/sync-response.json
          echo ""
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Sync failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Run model & slip unit tests
        run: pnpm test
