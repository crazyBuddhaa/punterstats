name: Manual Season Data Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-season:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Supabase current-season sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing APP_URL or CRON_SECRET repository secret."
            exit 1
          fi
          URL="${APP_URL%/}/api/cron/sync-season"
          echo "Triggering $URL ..."
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/sync-response.json \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL")
          cat /tmp/sync-response.json
          echo ""
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Sync failed with HTTP $HTTP_CODE"
            exit 1
          fi
