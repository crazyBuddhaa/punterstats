# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
# Any npm package version must have been published for at least 1 day
# (1440 minutes) before pnpm will install it. Malicious releases are usually
# pulled within hours, so this delay is a strong safety buffer.
#
# Do not disable this. For an urgent fix to a trusted package, add it to
# `minimumReleaseAgeExclude` temporarily and remove it once the window passes.
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - scripts

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - unrs-resolver
